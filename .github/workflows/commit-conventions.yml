# Checks the commit messages and the title of a pull request with the
# commit-msg hook of qoax-githooks. The action also compares the tracked copy
# at .githooks/commit-msg with the hook of the release that it pins.
#
# The pin is a commit sha, and the comment after it names the release.
# Dependabot moves both, but it updates the comment only while the release is
# its last token. When a bump changes the hook, the compare fails and prints
# the command that writes the new hook into the copy.
name: Check commit conventions

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

# A pull request may cancel its own earlier run: the next one re-checks the
# whole range. A push may not — it is checked over the range it pushed, so
# cancelling it would leave those commits unchecked by anything. Give each push
# a group of its own instead.
concurrency:
  group: >-
    commit-conventions-${{ github.event.pull_request.number
      || format('{0}@{1}', github.ref, github.sha) }}
  cancel-in-progress: true

jobs:
  commit-conventions:
    # The ruleset of this repository requires this check by its name.
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      # The full history is needed: the range to check is resolved from the
      # shas the event itself carries.
      - name: Check out this repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # With squash merging, the title of a pull request becomes the subject
      # on main. Thus the action checks the title with the same rules as the
      # commits.
      - name: Check commit messages and pull request title
        uses: qoax-community/qoax-githooks@4abc39a4da0306503a66682044f5fe8d7f929922 # v1.1.0

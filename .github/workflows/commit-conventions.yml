# The hook and the rules it enforces live in qoax-community/qoax-githooks. The
# `v1` tag tracks the current major line, so a new rule reaches this
# repository on its next run without a pull request here.
#
# Every other repository in the organization calls a shared workflow in
# qoax-reusables, which decides that version centrally. This one calls the
# action itself, because it is the organization's only public repository and a
# public repository may not call a `workflow_call` workflow that lives in a
# private one. The action is reachable because qoax-githooks is public too.
name: Check commit conventions

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

# A pull request may cancel its own earlier run: the next one re-checks the
# whole range. A push may not — it is checked over the range it pushed, so
# cancelling it would leave those commits unchecked by anything. Give each push
# a group of its own instead.
concurrency:
  group: >-
    commit-conventions-${{ github.event.pull_request.number
      || format('{0}@{1}', github.ref, github.sha) }}
  cancel-in-progress: true

jobs:
  commit-conventions:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      # The full history is needed: the range to check is resolved from the
      # shas the event itself carries.
      - name: Check out this repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # The commits this event added, plus the pull request title — with
      # squash merging the title becomes the subject on main, so it is held to
      # the same rules. The submodule pinned in this repository is not used:
      # CI is the gate, and a repository should not be able to weaken its own
      # gate by holding an older hook.
      - name: Check commit messages and pull request title
        uses: qoax-community/qoax-githooks@v1

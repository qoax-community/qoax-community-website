name: Build GitHub Pages branch

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH:
      NEXT_PUBLIC_SITE_URL: https://qo.ax
      # Social channels: leave empty to hide, fill with a full URL and push to show.
      NEXT_PUBLIC_SOCIAL_FACEBOOK: ""
      NEXT_PUBLIC_SOCIAL_INSTAGRAM: ""
      NEXT_PUBLIC_SOCIAL_LINKEDIN: ""
      NEXT_PUBLIC_SOCIAL_YOUTUBE: ""
      NEXT_PUBLIC_SOCIAL_TIKTOK: ""
      NEXT_PUBLIC_SOCIAL_DISCORD: ""
      NEXT_PUBLIC_SOCIAL_VIBER: ""
      # Google Search Console HTML-tag token (content value only). Empty = no tag.
      NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ""
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Refresh the YouTube playlist
        id: playlist
        run: python3 scripts/refresh-youtube-playlist.py --restore-live

      - name: Use Node.js 22
        if: github.event_name != 'schedule' || steps.playlist.outputs.changed == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.playlist.outputs.changed == 'true'
        run: npm ci

      - name: Build static site
        if: github.event_name != 'schedule' || steps.playlist.outputs.changed == 'true'
        run: npm run build:pages

      - name: Disable Jekyll processing
        if: github.event_name != 'schedule' || steps.playlist.outputs.changed == 'true'
        run: touch out/.nojekyll

      - name: Publish generated files to gh-pages
        if: github.event_name != 'schedule' || steps.playlist.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Deploy ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:gh-pages
